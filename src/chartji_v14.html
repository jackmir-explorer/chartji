<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>차트지 v14 — Guideline Panel</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="styles.css"/>
<script src="constants.js"></script>
<script src="prompts.js"></script>
<script src="api.js"></script>
<script type="text/babel" src="components/primitives.js"></script>
<script type="text/babel" src="components/panels.js"></script>
<script type="text/babel" src="components/chart-output.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect}=React;
/* ══════════════════════════════════════════════════════════
   APP
══════════════════════════════════════════════════════════ */
function App(){

  /* ── UI state ── */
  var [screen,    setScreen]    = useState("input");
  var [raw,       setRaw]       = useState("");
  var [chartText, setChartText] = useState(null);
  var [loading,   setLoading]   = useState(false);
  var [loadMsg,   setLoadMsg]   = useState("");
  var [error,     setError]     = useState("");
  var [copied,    setCopied]    = useState(false);
  var [editMode,  setEditMode]  = useState(false);
  var [consent,   setConsent]   = useState(false);
  var [autoDelete,setAutoDelete]= useState(false);
  var [problemAnalyses,setProblemAnalyses] = useState({});

  /* ── 재진 Context ── */
  var [followUpCtx,  setFollowUpCtx]  = useState("");
  var [showCtxInput, setShowCtxInput] = useState(false);

  /* ── Working Draft ── */
  var [draftText,   setDraftText]   = useState("");
  var [draftLoading,setDraftLoading]= useState(false);
  var [leftTab,     setLeftTab]     = useState("raw"); /* "raw" | "draft" | "guideline" */

  /* ── Guideline Panel ── */
  var [guidelineText,   setGuidelineText]   = useState("");
  var [guidelineLoading,setGuidelineLoading]= useState(false);

  /* ── 4 independent live panel states ── */
  var [livePanels,setLivePanels] = useState({
    triage:   Object.assign({},EMPTY_PANEL_STATE),
    missing:  Object.assign({},EMPTY_PANEL_STATE),
    redFlag:  Object.assign({},EMPTY_PANEL_STATE),
    problems: Object.assign({},EMPTY_PANEL_STATE),
  });
  var [liveEnabled,setLiveEnabled] = useState(true);

  function setPanelState(key,patch){
    setLivePanels(function(prev){
      var next=Object.assign({},prev);
      next[key]=Object.assign({},prev[key],patch);
      return next;
    });
  }

  /* Timer refs per panel */
  var triageTimerRef   = useRef(null);
  var missingTimerRef  = useRef(null);
  var redFlagTimerRef  = useRef(null);
  var problemsTimerRef = useRef(null);
  var draftTimerRef    = useRef(null);

  /* Last-analyzed text refs per panel */
  var lastTriageRef    = useRef("");
  var lastMissingRef   = useRef("");
  var lastRedFlagRef   = useRef("");
  var lastProblemsRef  = useRef("");
  var lastDraftRef     = useRef("");

  /* ── API 키 ── */
  var [apiKey,  setApiKey]  = useState(function(){return localStorage.getItem("cj_key")||"";});
  var [keyInput,setKeyInput]= useState("");
  var [showKey, setShowKey] = useState(!localStorage.getItem("cj_key"));

  /* ── 음성인식 ── */
  var recognitionRef = useRef(null);
  var finalTextRef   = useRef("");
  var taRef          = useRef(null);
  var [isRecording,setIsRecording] = useState(false);
  var [interimText,setInterimText] = useState("");
  var [voiceMsg,   setVoiceMsg]    = useState("");
  var voiceOk = typeof window!=="undefined"&&
    (window.SpeechRecognition||window.webkitSpeechRecognition);

  var localCC = detectLocalCC(raw);

  /* ─────────────────────────────────────────────────────────────
     4-panel independent update effect + Working Draft
  ───────────────────────────────────────────────────────────── */
  useEffect(function(){
    if(!liveEnabled||!apiKey) return;
    var trimmed=raw.trim();

    function run(timerRef,lastRef,minLen,delay,key,generateFn){
      if(trimmed.length<minLen) return;
      if(trimmed===lastRef.current) return;
      clearTimeout(timerRef.current);
      timerRef.current=setTimeout(async function(){
        if(trimmed===lastRef.current) return;
        lastRef.current=trimmed;
        setPanelState(key,{loading:true,error:""});
        try{
          var result=await generateFn(trimmed,apiKey);
          setPanelState(key,{data:result,loading:false});
        }catch(e){
          setPanelState(key,{error:e.message||(key+" 오류"),loading:false});
        }
      },delay);
    }

    run(triageTimerRef,   lastTriageRef,   10,  900,  "triage",
        function(t,k){return generateTriagePanel(t,k,followUpCtx);});
    run(redFlagTimerRef,  lastRedFlagRef,  20,  1200, "redFlag",
        function(t,k){return generateRedFlagPanel(t,k);});
    run(missingTimerRef,  lastMissingRef,  30,  1800, "missing",
        function(t,k){return generateMissingPanel(t,k,followUpCtx);});
    run(problemsTimerRef, lastProblemsRef, 50,  2500, "problems",
        function(t,k){return generateProblemsPanel(t,k,followUpCtx);});

    /* Working Draft — 50자↑ / 3s debounce */
    if(trimmed.length>=50&&trimmed!==lastDraftRef.current){
      clearTimeout(draftTimerRef.current);
      draftTimerRef.current=setTimeout(async function(){
        if(trimmed===lastDraftRef.current) return;
        lastDraftRef.current=trimmed;
        setDraftLoading(true);
        try{
          var d=await generateWorkingDraft(trimmed,apiKey,followUpCtx);
          setDraftText(d);
        }catch(_){}
        finally{setDraftLoading(false);}
      },3000);
    }

    return function(){
      clearTimeout(triageTimerRef.current);
      clearTimeout(missingTimerRef.current);
      clearTimeout(redFlagTimerRef.current);
      clearTimeout(problemsTimerRef.current);
      clearTimeout(draftTimerRef.current);
    };
  },[raw,liveEnabled,apiKey,followUpCtx]);

  /* ── API 키 저장 ── */
  function saveKey(){
    var k=keyInput.trim(); if(!k) return;
    localStorage.setItem("cj_key",k);
    setApiKey(k); setKeyInput(""); setShowKey(false);
  }

  /* ── 음성인식 ── */
  function startRecording(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
    var r=new SR();
    r.lang="ko-KR"; r.continuous=true; r.interimResults=true;
    r.onresult=function(e){
      var interim="",final=finalTextRef.current;
      for(var i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) final+=e.results[i][0].transcript;
        else interim+=e.results[i][0].transcript;
      }
      finalTextRef.current=final; setRaw(final); setInterimText(interim);
    };
    r.onerror=function(e){setVoiceMsg("음성 오류: "+e.error);setIsRecording(false);};
    r.onend=function(){setIsRecording(false);setInterimText("");};
    recognitionRef.current=r; r.start(); setIsRecording(true); setVoiceMsg("");
  }
  function stopRecording(){
    if(recognitionRef.current) recognitionRef.current.stop();
    setIsRecording(false); setInterimText("");
  }

  /* ── 세션 초기화 ── */
  function clearSession(){
    setRaw(""); setChartText(null); setError(""); setCopied(false);
    setProblemAnalyses({}); finalTextRef.current=""; setScreen("input");
    setDraftText(""); setDraftLoading(false);
    setGuidelineText(""); setGuidelineLoading(false);
    lastDraftRef.current=""; clearTimeout(draftTimerRef.current);
    setLivePanels({
      triage:   Object.assign({},EMPTY_PANEL_STATE),
      missing:  Object.assign({},EMPTY_PANEL_STATE),
      redFlag:  Object.assign({},EMPTY_PANEL_STATE),
      problems: Object.assign({},EMPTY_PANEL_STATE),
    });
    lastTriageRef.current=""; lastMissingRef.current="";
    lastRedFlagRef.current=""; lastProblemsRef.current="";
    clearTimeout(triageTimerRef.current); clearTimeout(missingTimerRef.current);
    clearTimeout(redFlagTimerRef.current); clearTimeout(problemsTimerRef.current);
  }

  function handleAnalysisUpdate(probNum,type,result){
    setProblemAnalyses(function(prev){
      var key="P"+probNum;
      var updated=Object.assign({},prev[key]||{});
      updated[type]=result;
      var next=Object.assign({},prev);
      next[key]=updated; return next;
    });
  }

  /* ── Final Chart 생성 ── */
  async function generate(mode){
    if(!raw.trim()) return;
    if(!apiKey){setError("API 키를 입력해주세요.");return;}
    setLoading(true); setError(""); setProblemAnalyses({});
    var hint=null;
    if(mode==="complex"){
      try{
        setLoadMsg("1/2  문제 목록 추출 중...");
        var step1=await extractProblemList(raw,apiKey);
        if(step1&&Array.isArray(step1.problemList)&&step1.problemList.length>0){
          hint=step1.problemList.map(function(p,i){return "- P"+(i+1)+": "+p.title;}).join("\n");
        }
      }catch(e){setError("문제 목록 추출 실패, 단일 분석으로 전환합니다. ("+e.message+")");}
      try{
        setLoadMsg("2/2  차트 작성 중...");
        var text=await generateBaseChart(raw,apiKey,hint,followUpCtx);
        setChartText(text); setScreen("output");
      }catch(e2){setError("차트 생성 오류: "+e2.message);}
    }else{
      try{
        setLoadMsg("차트 작성 중...");
        var text2=await generateBaseChart(raw,apiKey,null,followUpCtx);
        setChartText(text2); setScreen("output");
      }catch(e){setError("차트 생성 오류: "+e.message);}
    }
    setLoading(false); setLoadMsg("");
  }

  /* ── EMR 복사 ── */
  async function copyChart(){
    if(!chartText) return;
    try{await navigator.clipboard.writeText(chartText);}
    catch(_){
      var t=document.createElement("textarea");
      t.value=chartText; document.body.appendChild(t);
      t.select(); document.execCommand("copy"); document.body.removeChild(t);
    }
    setCopied(true);
    setTimeout(function(){setCopied(false);if(autoDelete)clearSession();},2500);
  }

  /* ── Guideline 탭 클릭 — 온디맨드 생성 ── */
  async function handleGuidelineTabClick(){
    setLeftTab("guideline");
    if(guidelineText||guidelineLoading) return;
    if(!raw.trim()||!apiKey) return;
    var problems=(livePanels.problems.data&&livePanels.problems.data.problems)||[];
    setGuidelineLoading(true);
    try{
      var result=await generateGuidelinePanel(raw,problems,apiKey);
      setGuidelineText(result);
    }catch(e){setGuidelineText("[Guideline 생성 오류: "+e.message+"]");}
    finally{setGuidelineLoading(false);}
  }

  var canGen=!loading&&!!raw.trim();
  function tabSt(on){
    return{flex:1,padding:"11px 0",fontSize:13,fontWeight:700,
      color:on?"#c96442":"#4a5268",background:"none",border:"none",
      borderBottom:on?"2px solid #c96442":"2px solid transparent",cursor:"pointer"};
  }

  /* ════════════════════════════════════════════ RENDER ════════════════════════════════════════════ */
  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",
      background:"#0d1018",color:"#e2e4ec",
      fontFamily:"'Noto Sans KR',-apple-system,sans-serif",fontSize:14}}>

      {/* 면책 배너 */}
      <div style={{background:"rgba(245,166,35,.07)",borderBottom:"1px solid rgba(245,166,35,.16)",
        padding:"7px 14px",display:"flex",gap:8,alignItems:"flex-start",flexShrink:0}}>
        <span style={{color:"#f5a623",flexShrink:0}}>⚠</span>
        <span style={{fontSize:11,color:"rgba(245,166,35,.85)",lineHeight:1.65}}>
          <b>임상 문서 보조 도구.</b> 진단·처방 제안 아님. 모든 초안은 의사 직접 검토 후 EMR 입력.{" "}
          <b>환자 식별 정보 입력 금지. 녹음은 브라우저에서만 처리.</b>
        </span>
      </div>

      {/* 탑바 */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
        padding:"0 14px",height:50,background:"#131924",
        borderBottom:"1px solid #1e2538",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:16,fontWeight:800,color:"#c96442",letterSpacing:"-.02em"}}>차트지</span>
          <span style={{fontSize:10,color:"#2e374f",background:"#0d1018",
            border:"1px solid #1e2538",padding:"2px 8px",borderRadius:20,
            fontFamily:"'JetBrains Mono',monospace"}}>FM v14 · Guideline Panel 추가</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{display:"flex",alignItems:"center",gap:5,background:"#0d1018",
            border:"1px solid #1e2538",padding:"4px 10px",borderRadius:20}}>
            <span style={{width:6,height:6,borderRadius:"50%",
              background:isRecording?"#f87171":"#1e2538",display:"inline-block",
              animation:isRecording?"blink 1.2s ease-in-out infinite":"none"}}/>
            <span style={{fontSize:11,color:isRecording?"#f87171":"#4a5268",fontWeight:600}}>
              {isRecording?"녹음 중":"대기"}</span>
          </div>
          <button onClick={function(){setShowKey(function(v){return !v;});}}
            style={{fontSize:11,padding:"4px 10px",borderRadius:5,background:"none",
              color:apiKey?"#34c77b":"#f5a623",
              border:"1px solid "+(apiKey?"rgba(52,199,123,.3)":"rgba(245,166,35,.3)")}}>
            {apiKey?"🔑 키 등록됨":"🔑 API 키 입력"}
          </button>
        </div>
      </div>

      {/* API 키 패널 */}
      {showKey&&(
        <div style={{background:"#131924",borderBottom:"1px solid #1e2538",
          padding:"14px 16px",flexShrink:0,animation:"slideDown .2s ease"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#4a5268",marginBottom:10,
            fontFamily:"'JetBrains Mono',monospace"}}>🔑 Anthropic API 키</div>
          <div style={{display:"flex",gap:8,marginBottom:8}}>
            <input type="password" value={keyInput}
              onChange={function(e){setKeyInput(e.target.value);}}
              onKeyDown={function(e){if(e.key==="Enter")saveKey();}}
              placeholder="sk-ant-api03-..."
              style={{flex:1,background:"#0d1018",border:"1px solid #1e2538",
                borderRadius:7,padding:"9px 12px",color:"#e2e4ec",fontSize:13}}/>
            <button onClick={saveKey}
              style={{background:"#c96442",color:"#fff",borderRadius:7,
                padding:"9px 20px",fontSize:13,fontWeight:700}}>저장</button>
          </div>
          {apiKey&&!keyInput&&<div style={{fontSize:11,color:"#34c77b",marginBottom:6}}>✓ 키 등록됨</div>}
          <div style={{fontSize:11,color:"#2e374f",lineHeight:1.8}}>
            👉 <a href="https://console.anthropic.com" target="_blank" rel="noreferrer"
              style={{color:"#c96442"}}>console.anthropic.com</a> → API Keys → Create Key
          </div>
        </div>
      )}

      {/* 탭바 */}
      <div style={{display:"flex",background:"#131924",borderBottom:"1px solid #1e2538",flexShrink:0}}>
        <button style={tabSt(screen==="input")} onClick={function(){setScreen("input");}}>
          🎙 녹음 · 입력
        </button>
        <button style={tabSt(screen==="output")} onClick={function(){if(chartText)setScreen("output");}}>
          {"📋 차트"+((!chartText)?" (미생성)":"")}
        </button>
      </div>

      {/* ══════ 입력 탭 ══════ */}
      {screen==="input"&&(
        <div style={{flex:1,padding:12,overflowY:"auto"}}>

          {/* 사용 설정 */}
          <div style={{background:"#131924",border:"1px solid #1e2538",
            borderRadius:12,padding:14,marginBottom:10}}>
            <div style={{fontSize:10,fontWeight:700,color:"#4a5268",textTransform:"uppercase",
              letterSpacing:".08em",marginBottom:12,
              fontFamily:"'JetBrains Mono',monospace"}}>사용 설정</div>
            <div onClick={function(){setConsent(function(v){return !v;});}}
              style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",marginBottom:12}}>
              <div style={{width:18,height:18,borderRadius:4,flexShrink:0,marginTop:1,
                border:"2px solid "+(consent?"#c96442":"#2e374f"),
                background:consent?"#c96442":"transparent",
                display:"flex",alignItems:"center",justifyContent:"center"}}>
                {consent&&<span style={{color:"#fff",fontSize:12,fontWeight:900,lineHeight:1}}>✓</span>}
              </div>
              <span style={{fontSize:12,color:"#94a3b8",lineHeight:1.75}}>
                음성 전사 사용에 동의합니다. 녹음은 브라우저에서만 처리되며 외부 저장 없음. 환자 식별 정보 미포함 주의.
              </span>
            </div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
              paddingTop:10,borderTop:"1px solid #1e2538"}}>
              <span style={{fontSize:12,color:"#94a3b8"}}>복사 후 자동 세션 삭제</span>
              <div onClick={function(){setAutoDelete(function(v){return !v;});}}
                style={{width:40,height:22,borderRadius:11,
                  background:autoDelete?"#c96442":"#1e2538",
                  position:"relative",cursor:"pointer",transition:"background .2s"}}>
                <div style={{position:"absolute",top:3,width:16,height:16,borderRadius:"50%",
                  background:"#e2e4ec",transition:"left .2s",left:autoDelete?21:3}}/>
              </div>
            </div>

            {/* ── 재진 Context ── */}
            <div style={{paddingTop:10,borderTop:"1px solid #1e2538",marginTop:10}}>
              <div onClick={function(){setShowCtxInput(function(v){return !v;});}}
                style={{display:"flex",alignItems:"center",justifyContent:"space-between",
                  cursor:"pointer",userSelect:"none"}}>
                <span style={{fontSize:11,fontWeight:600,
                  color:followUpCtx.trim()?"#60a5fa":"#4a5268",
                  display:"flex",alignItems:"center",gap:5}}>
                  재진 Context
                  {followUpCtx.trim()&&(
                    <span style={{fontSize:9,background:"rgba(96,165,250,.15)",
                      border:"1px solid rgba(96,165,250,.3)",color:"#60a5fa",
                      borderRadius:10,padding:"1px 6px",fontFamily:"'JetBrains Mono',monospace"}}>ON</span>
                  )}
                </span>
                <span style={{fontSize:9,color:"#2e374f"}}>{showCtxInput?"▲":"▼"}</span>
              </div>
              {showCtxInput&&(
                <div style={{marginTop:8,animation:"slideDown .15s ease"}}>
                  <textarea value={followUpCtx}
                    onChange={function(e){setFollowUpCtx(e.target.value);}}
                    rows={3}
                    placeholder={"예) DM f/u. 지난달 HbA1c 8.2. metformin 500mg bid 복용 중.\n비워두면 초진과 동일하게 동작."}
                    style={{width:"100%",background:"#0d1018",
                      border:"1px solid rgba(96,165,250,.2)",
                      borderRadius:6,padding:"8px 10px",color:"#94a3b8",fontSize:12,
                      lineHeight:1.65,resize:"vertical"}}/>
                  <div style={{display:"flex",justifyContent:"space-between",
                    alignItems:"center",marginTop:4}}>
                    <span style={{fontSize:10,color:"#2e374f"}}>
                      ⚑ Red Flag 판단에 영향 없음
                    </span>
                    <span style={{fontSize:10,color:"#2e374f",
                      fontFamily:"'JetBrains Mono',monospace"}}>
                      {followUpCtx.length}자
                    </span>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* 음성 컨트롤 */}
          <div style={{background:"#131924",
            border:"1px solid "+(isRecording?"rgba(248,113,113,.35)":"#1e2538"),
            borderRadius:12,padding:14,marginBottom:10}}>
            <div style={{fontSize:10,fontWeight:700,color:"#4a5268",textTransform:"uppercase",
              letterSpacing:".08em",marginBottom:12,
              fontFamily:"'JetBrains Mono',monospace"}}>음성 입력</div>
            {!voiceOk?(
              <div style={{padding:"10px 12px",background:"rgba(245,166,35,.07)",
                border:"1px solid rgba(245,166,35,.2)",borderRadius:8,fontSize:12,
                color:"#f5a623",lineHeight:1.7}}>
                ⚠ Chrome 브라우저에서만 음성인식이 지원됩니다.
              </div>
            ):(
              <div>
                <div style={{display:"flex",gap:8,marginBottom:10}}>
                  {!isRecording?(
                    <button onClick={startRecording} disabled={!consent}
                      style={{flex:1,padding:"12px 0",fontSize:14,fontWeight:700,
                        borderRadius:8,cursor:consent?"pointer":"not-allowed",
                        background:consent?"#c96442":"#1e2538",
                        color:consent?"#fff":"#4a5268",
                        display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                      <span style={{fontSize:18}}>🎙</span> 녹음 시작
                    </button>
                  ):(
                    <button onClick={stopRecording}
                      style={{flex:1,padding:"12px 0",fontSize:14,fontWeight:700,
                        borderRadius:8,cursor:"pointer",
                        background:"rgba(248,113,113,.1)",color:"#f87171",
                        border:"1px solid rgba(248,113,113,.4)",
                        display:"flex",alignItems:"center",justifyContent:"center",gap:8,
                        animation:"blink 1.4s ease-in-out infinite"}}>
                      <span style={{width:12,height:12,borderRadius:2,
                        background:"#f87171",display:"inline-block"}}/> 녹음 중지
                    </button>
                  )}
                  <button onClick={clearSession}
                    style={{background:"#0d1018",color:"#4a5268",
                      border:"1px solid #1e2538",borderRadius:8,
                      padding:"12px 14px",fontSize:13,fontWeight:600}}>🗑 초기화</button>
                </div>
                {interimText&&(
                  <div style={{padding:"8px 10px",background:"rgba(96,165,250,.05)",
                    border:"1px dashed rgba(96,165,250,.25)",borderRadius:6,
                    fontSize:12,color:"#60a5fa",lineHeight:1.75,marginBottom:8,fontStyle:"italic"}}>
                    <span style={{fontSize:10,color:"#2e374f",display:"block",
                      marginBottom:2,fontStyle:"normal"}}>인식 중...</span>
                    {interimText}
                  </div>
                )}
              </div>
            )}
            {voiceMsg&&<div style={{fontSize:12,color:"#4a5268",lineHeight:1.6,marginTop:8}}>ℹ {voiceMsg}</div>}
          </div>

          {/* ── 2-column: transcript (left) | 4-panel dashboard (right) ── */}
          <div className="input-layout">

            {/* LEFT: Working Draft / Raw 탭 + 생성 버튼 */}
            <div className="input-left">
              <div style={{background:"#131924",border:"1px solid #1e2538",
                borderRadius:12,padding:14,display:"flex",flexDirection:"column"}}>

                {/* 헤더: 탭 + 예시 버튼 */}
                <div style={{display:"flex",justifyContent:"space-between",
                  alignItems:"center",marginBottom:8}}>
                  {/* 좌: 탭 */}
                  <div style={{display:"flex",gap:2,alignItems:"center"}}>
                    {["raw","draft","guideline"].map(function(tab){
                      var on=leftTab===tab;
                      var tabColor=tab==="draft"?"#60a5fa":tab==="guideline"?"#a78bfa":"#94a3b8";
                      var tabBorder=tab==="draft"?"rgba(96,165,250,.3)":tab==="guideline"?"rgba(167,139,250,.3)":"#1e2538";
                      var tabLabel=tab==="raw"?"전사":tab==="draft"?"Working Draft":"가이드라인";
                      var isGuide=tab==="guideline";
                      var isDraft=tab==="draft";
                      return (
                        <button key={tab}
                          onClick={function(){
                            if(tab==="guideline") handleGuidelineTabClick();
                            else setLeftTab(tab);
                          }}
                          style={{fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:5,
                            color:on?tabColor:"#2e374f",
                            background:on?"#0d1018":"transparent",
                            border:"1px solid "+(on?tabBorder:"transparent"),
                            cursor:"pointer",letterSpacing:".05em",textTransform:"uppercase",
                            fontFamily:"'JetBrains Mono',monospace",
                            display:"flex",alignItems:"center",gap:4}}>
                          {tabLabel}
                          {isDraft&&draftLoading&&(
                            <span style={{width:6,height:6,border:"1px solid #252d42",
                              borderTopColor:"#60a5fa",borderRadius:"50%",display:"inline-block",
                              animation:"spin .65s linear infinite"}}/>
                          )}
                          {isDraft&&!draftLoading&&draftText&&(
                            <span style={{fontSize:8,color:"rgba(96,165,250,.5)"}}>✓</span>
                          )}
                          {isGuide&&guidelineLoading&&(
                            <span style={{width:6,height:6,border:"1px solid #252d42",
                              borderTopColor:"#a78bfa",borderRadius:"50%",display:"inline-block",
                              animation:"spin .65s linear infinite"}}/>
                          )}
                          {isGuide&&!guidelineLoading&&guidelineText&&(
                            <span style={{fontSize:8,color:"rgba(167,139,250,.5)"}}>✓</span>
                          )}
                        </button>
                      );
                    })}
                    {leftTab==="raw"&&isRecording&&(
                      <span style={{fontSize:9,color:"#f87171",
                        background:"rgba(248,113,113,.1)",
                        border:"1px solid rgba(248,113,113,.3)",
                        padding:"2px 7px",borderRadius:10,marginLeft:4}}>● 자동 입력 중</span>
                    )}
                  </div>
                  {/* 우: 예시/지우기 버튼 */}
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={function(){setRaw(SAMPLE);finalTextRef.current=SAMPLE;setVoiceMsg("예시(단순) 입력됨.");}}
                      style={{fontSize:11,color:"#4a5268",padding:"4px 10px",
                        borderRadius:5,border:"1px solid #1e2538",background:"none"}}>예시(단순)</button>
                    <button onClick={function(){setRaw(SAMPLE_COMPLEX);finalTextRef.current=SAMPLE_COMPLEX;setVoiceMsg("예시(복합) 입력됨.");}}
                      style={{fontSize:11,color:"#f5a623",padding:"4px 10px",
                        borderRadius:5,border:"1px solid rgba(245,166,35,.3)",background:"none"}}>예시(복합)</button>
                    {raw&&<button onClick={function(){setRaw("");finalTextRef.current="";}}
                      style={{fontSize:11,color:"#4a5268",padding:"4px 10px",
                        borderRadius:5,border:"1px solid #1e2538",background:"none"}}>지우기</button>}
                  </div>
                </div>

                {/* 전사 탭 */}
                {leftTab==="raw"&&(
                  <>
                    <textarea ref={taRef} value={raw}
                      onChange={function(e){setRaw(e.target.value);finalTextRef.current=e.target.value;}}
                      style={{background:"#0d1018",border:"1px solid #1e2538",borderRadius:8,
                        padding:"10px 12px",color:"#e2e4ec",fontSize:13,lineHeight:1.75,
                        minHeight:240,resize:"vertical"}}
                      placeholder={"🎙 녹음 또는 직접 타이핑\n\n화자 라벨 없어도 됩니다. 대화체 그대로.\n\n⚠ 환자 이름·주민번호 입력 금지"}/>
                    <div style={{fontSize:10,color:"#2e374f",textAlign:"right",marginTop:4,
                      fontFamily:"'JetBrains Mono',monospace"}}>{raw.length}자</div>
                  </>
                )}

                {/* Guideline Panel 탭 */}
                {leftTab==="guideline"&&(
                  <div style={{background:"#0d1018",border:"1px solid rgba(167,139,250,.2)",
                    borderRadius:8,padding:"10px 12px",minHeight:240,overflowY:"auto"}}>
                    {guidelineLoading&&!guidelineText&&(
                      <div style={{display:"flex",alignItems:"center",gap:6,
                        color:"#2e374f",fontStyle:"italic",fontSize:12}}>
                        <span style={{width:8,height:8,border:"1.5px solid #252d42",
                          borderTopColor:"#a78bfa",borderRadius:"50%",display:"inline-block",
                          animation:"spin .65s linear infinite"}}/>
                        Guideline Panel 생성 중...
                      </div>
                    )}
                    {!guidelineLoading&&!guidelineText&&(
                      <div style={{fontSize:12,color:"#2e374f",fontStyle:"italic"}}>
                        {!raw.trim()
                          ?"전사 탭에 내용을 먼저 입력하세요."
                          :!apiKey
                          ?"API 키를 입력하면 가이드라인을 불러옵니다."
                          :"가이드라인 탭을 클릭하면 생성됩니다."}
                      </div>
                    )}
                    {guidelineText&&(
                      <GuidelineRenderer text={guidelineText}
                        onRefresh={function(){
                          setGuidelineText("");
                          handleGuidelineTabClick();
                        }}/>
                    )}
                  </div>
                )}

                {/* Working Draft 탭 */}
                {leftTab==="draft"&&(
                  <div style={{background:"#0d1018",border:"1px solid #1e2538",borderRadius:8,
                    padding:"10px 12px",minHeight:240,overflowY:"auto",fontSize:12.5,
                    color:"#94a3b8",lineHeight:1.9,
                    fontFamily:"'JetBrains Mono',monospace",whiteSpace:"pre-wrap"}}>
                    {draftLoading&&!draftText&&(
                      <div style={{display:"flex",alignItems:"center",gap:6,color:"#2e374f",fontStyle:"italic"}}>
                        <span style={{width:8,height:8,border:"1.5px solid #252d42",
                          borderTopColor:"#60a5fa",borderRadius:"50%",display:"inline-block",
                          animation:"spin .65s linear infinite"}}/>
                        Working Draft 생성 중...
                      </div>
                    )}
                    {!draftLoading&&!draftText&&(
                      <span style={{color:"#2e374f",fontStyle:"italic"}}>
                        전사 탭에 50자 이상 입력되면 자동 생성됩니다.
                      </span>
                    )}
                    {draftText&&(
                      <div>
                        <div style={{fontSize:9,fontWeight:700,color:"#2e374f",
                          textTransform:"uppercase",letterSpacing:".07em",marginBottom:8,
                          borderBottom:"1px solid #1e2538",paddingBottom:4}}>
                          Working Draft — 의사 검토 필수
                          {draftLoading&&(
                            <span style={{marginLeft:8,width:6,height:6,border:"1px solid #252d42",
                              borderTopColor:"#60a5fa",borderRadius:"50%",display:"inline-block",
                              animation:"spin .65s linear infinite",verticalAlign:"middle"}}/>
                          )}
                        </div>
                        {draftText}
                      </div>
                    )}
                  </div>
                )}

                {error&&<div style={{marginTop:8,padding:"10px 12px",
                  background:"rgba(232,93,93,.08)",border:"1px solid rgba(232,93,93,.28)",
                  borderRadius:8,fontSize:12,color:"#e85d5d",lineHeight:1.65}}>{error}</div>}

                <div style={{marginTop:10,padding:"9px 12px",
                  background:"rgba(96,165,250,.04)",
                  border:"1px solid rgba(96,165,250,.12)",borderRadius:8}}>
                  <div style={{fontSize:11,color:"#4a5268",lineHeight:1.7}}>
                    v13 · Triage 10자↑·900ms / RedFlag 20자↑·1.2s / Missing 30자↑·1.8s / Problems 50자↑·2.5s / Draft 50자↑·3s
                  </div>
                  <div style={{fontSize:10,color:"#2e374f",marginTop:3}}>
                    각 패널 독립 갱신 · Working Draft 실시간 구조화 · Final Chart → EMR 복사
                  </div>
                </div>

                {/* Final Chart 버튼 */}
                {loading?(
                  <div style={{marginTop:10,background:"#1e2538",borderRadius:8,padding:"14px",
                    display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
                    <span style={{width:14,height:14,border:"2px solid rgba(255,255,255,.3)",
                      borderTopColor:"#c96442",borderRadius:"50%",display:"inline-block",
                      animation:"spin .7s linear infinite"}}/>
                    <span style={{fontSize:13,fontWeight:700,color:"#94a3b8"}}>{loadMsg}</span>
                  </div>
                ):(
                  <div style={{display:"flex",gap:8,marginTop:10}}>
                    <button onClick={function(){generate("simple");}} disabled={!canGen}
                      style={{flex:1,borderRadius:8,padding:"13px 0",fontSize:13,fontWeight:700,
                        background:canGen?"#c96442":"#1e2538",
                        color:canGen?"#fff":"#4a5268",
                        cursor:canGen?"pointer":"not-allowed",
                        display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                      <span>⚡ Final Chart 생성</span>
                      <span style={{fontSize:10,fontWeight:400,opacity:.75}}>1-step · 단일 주호소</span>
                    </button>
                    <button onClick={function(){generate("complex");}} disabled={!canGen}
                      style={{flex:1,borderRadius:8,padding:"13px 0",fontSize:13,fontWeight:700,
                        background:canGen?"rgba(245,166,35,.1)":"#1e2538",
                        color:canGen?"#f5a623":"#4a5268",
                        border:canGen?"1px solid rgba(245,166,35,.35)":"1px solid #1e2538",
                        cursor:canGen?"pointer":"not-allowed",
                        display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                      <span>📋 복합 문제 분석</span>
                      <span style={{fontSize:10,fontWeight:400,opacity:.75}}>2-step · 문제 구조화</span>
                    </button>
                  </div>
                )}
              </div>
            </div>

            {/* RIGHT: 4-panel safety dashboard */}
            <div className="input-right">
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
                marginBottom:7,padding:"0 2px"}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{width:5,height:5,borderRadius:"50%",
                    background:liveEnabled?"#60a5fa":"#2e374f",display:"inline-block"}}/>
                  <span style={{fontSize:9,fontWeight:700,color:"#4a5268",
                    textTransform:"uppercase",letterSpacing:".07em",
                    fontFamily:"'JetBrains Mono',monospace"}}>안전 보조 패널</span>
                  {followUpCtx.trim()&&(
                    <span style={{fontSize:8,color:"rgba(96,165,250,.6)",
                      background:"rgba(96,165,250,.08)",border:"1px solid rgba(96,165,250,.2)",
                      borderRadius:8,padding:"1px 5px",fontFamily:"'JetBrains Mono',monospace"}}>
                      재진 ctx
                    </span>
                  )}
                </div>
                <button onClick={function(){setLiveEnabled(function(v){return !v;});}}
                  style={{fontSize:10,color:liveEnabled?"#60a5fa":"#4a5268",background:"none",
                    border:"1px solid "+(liveEnabled?"rgba(96,165,250,.3)":"#1e2538"),
                    borderRadius:5,padding:"2px 9px",cursor:"pointer"}}>
                  {liveEnabled?"ON":"OFF"}
                </button>
              </div>

              <RedFlagPanel panelState={livePanels.redFlag}/>
              <MissingPanel panelState={livePanels.missing}/>
              <TriagePanel  panelState={livePanels.triage}  localCC={localCC} rawLen={raw.length}/>
            </div>

          </div>
        </div>
      )}

      {/* ══════ 출력 탭 ══════ */}
      {screen==="output"&&(
        <div style={{flex:1,padding:12,overflowY:"auto"}}>
          {!chartText?(
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",
              justifyContent:"center",padding:"60px 0",gap:10}}>
              <div style={{fontSize:36,opacity:.15}}>📋</div>
              <div style={{color:"#4a5268",fontWeight:700}}>차트 미생성</div>
              <button onClick={function(){setScreen("input");}}
                style={{marginTop:8,fontSize:12,color:"#c96442",background:"none",
                  border:"1px solid #c96442",borderRadius:6,padding:"7px 14px"}}>← 입력으로</button>
            </div>
          ):(
            <div>
              <div style={{display:"flex",alignItems:"center",gap:6,fontSize:10,
                fontWeight:700,color:"#f5a623",textTransform:"uppercase",
                letterSpacing:".05em",marginBottom:12}}>
                <span style={{width:5,height:5,borderRadius:"50%",
                  background:"#f5a623",display:"inline-block"}}/>
                초안 — 의사 검토 필수 · AI 생성 내용 반드시 확인
              </div>
              <div style={{display:"flex",gap:6,marginBottom:12}}>
                <button onClick={function(){setEditMode(false);}}
                  style={{fontSize:11,fontWeight:700,color:!editMode?"#c96442":"#4a5268",
                    background:"none",
                    border:"1px solid "+(!editMode?"rgba(201,100,66,.4)":"#1e2538"),
                    borderRadius:6,padding:"5px 12px",cursor:"pointer"}}>● 렌더 보기</button>
                <button onClick={function(){setEditMode(true);}}
                  style={{fontSize:11,fontWeight:700,color:editMode?"#60a5fa":"#4a5268",
                    background:"none",
                    border:"1px solid "+(editMode?"rgba(96,165,250,.4)":"#1e2538"),
                    borderRadius:6,padding:"5px 12px",cursor:"pointer"}}>✎ 텍스트 편집</button>
                <div style={{flex:1}}/>
                {editMode&&<span style={{fontSize:10,color:"#2e374f",alignSelf:"center"}}>복사 전 직접 수정 가능</span>}
              </div>
              <ChartOutput
                chartText={chartText} editMode={editMode} onEditText={setChartText}
                raw={raw} apiKey={apiKey}
                problemAnalyses={problemAnalyses} onAnalysisUpdate={handleAnalysisUpdate}/>
              <div style={{marginTop:12}}>
                <button onClick={copyChart}
                  style={{width:"100%",
                    background:copied?"rgba(52,199,123,.09)":"#c96442",
                    color:copied?"#34c77b":"#fff",
                    border:copied?"1px solid rgba(52,199,123,.35)":"none",
                    borderRadius:8,padding:"13px",fontSize:14,fontWeight:700,
                    cursor:"pointer",marginBottom:8}}>
                  {copied?"✓ 복사됨 — EMR에 붙여넣기 하세요":"📋 EMR 복사"}
                </button>
                {autoDelete&&!copied&&<div style={{fontSize:11,color:"#4a5268",
                  textAlign:"center",marginBottom:8}}>복사 시 세션 자동 삭제 예정</div>}
                <button onClick={function(){setScreen("input");}}
                  style={{background:"none",border:"1px solid #1e2538",color:"#4a5268",
                    borderRadius:8,padding:"9px",fontSize:12,fontWeight:600,width:"100%"}}>
                  ← 입력으로 돌아가기
                </button>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
